name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Developed and live-verified on Windows (DSH 0.2.0-rc.2); the lineage ledger uses
    # PowerShell CIM there and `ps` elsewhere.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dev dependencies (DSH LLM seam used by the adapter tests)
        run: npm install --no-audit --no-fund
      # The lineage ledger reads the process table through Windows PowerShell 5.1 + CIM
      # (src/peer/lineage.mjs) with a 20 s timeout. On a fresh runner the first
      # powershell.exe start and a cold WMI, under a fully parallel suite, can exceed it
      # and fail a root claim closed, so warm up the same binary with the same query and
      # run the suite with bounded concurrency.
      - name: Warm up Windows PowerShell and WMI
        shell: powershell
        run: Get-CimInstance Win32_Process -Property ProcessId,ParentProcessId,CreationDate | Select-Object ProcessId,ParentProcessId,CreationDate | ConvertTo-Json -Compress | Out-Null
      - name: Test
        run: node --test --test-concurrency=2 test/*.test.mjs
