name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Developed and live-verified on Windows (DSH 0.2.0-rc.2); the lineage ledger uses
    # PowerShell CIM there and `ps` elsewhere.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dev dependencies (DSH LLM seam used by the adapter tests)
        run: npm install --no-audit --no-fund
      # The lineage ledger reads the process table through CIM; a cold WMI on a fresh
      # runner can take longer than the 20 s read timeout and fail a root claim closed.
      - name: Warm up WMI
        shell: pwsh
        run: Get-CimInstance Win32_Process -Property ProcessId | Out-Null
      - name: Test
        run: npm test
